<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gather</title>
<meta name="theme-color" content="#1B1F3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gather">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" id="touchIcon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#1B1F3B; --ink-2:#4A4F6A; --ink-3:#8A8EA6;
  --bg:#F4F2EE; --card:#FFFFFF; --line:#E6E2DA;
  --accent:#FF6B3D; --accent-2:#FFB23F;
  --accent-soft:color-mix(in srgb, var(--accent) 14%, var(--card));
  --mine:#1B1F3B; --mine-ink:#FFFFFF; --theirs:#FFFFFF;
  --group:#3E4A8C; --ok:#2E9E6A; --danger:#D9443A; --lock:#6B5FB5; --lock-soft:#ECE9FA;
  --night:#1B1F3B;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F2F1F6; --ink-2:#C2C4D4; --ink-3:#8A8EA6;
    --bg:#12142A; --card:#1E2140; --line:#2D3156;
    --mine:var(--accent); --mine-ink:#FFFFFF; --theirs:#1E2140;
    --group:#7C88D6; --lock:#B3A8F0; --lock-soft:#2A2850; --night:#0B0C1C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#F2F1F6; --ink-2:#C2C4D4; --ink-3:#8A8EA6;
  --bg:#12142A; --card:#1E2140; --line:#2D3156;
  --mine:var(--accent); --mine-ink:#FFFFFF; --theirs:#1E2140;
  --group:#7C88D6; --lock:#B3A8F0; --lock-soft:#2A2850; --night:#0B0C1C; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.5;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
.hidden{display:none!important}
#app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
svg.i{width:22px;height:22px;flex-shrink:0}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* demo bar */
#demoBar{background:#FFF4C2;color:#5A4500;font-size:13px;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#demoBar select{font:inherit;font-size:13px;padding:2px 6px;border-radius:6px;border:1px solid #D8C26A;background:#fff;color:#5A4500;max-width:100%}

/* brand */
.brandmark{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;letter-spacing:-.5px;overflow:hidden;flex-shrink:0}
.brandmark img{width:100%;height:100%;object-fit:cover}
.brandmark.sm{width:32px;height:32px;border-radius:10px;font-size:11px}

/* splash / login */
.splash{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:calc(48px + var(--safe-t)) 24px calc(32px + var(--safe-b));background:var(--night);color:#fff;position:relative;overflow:hidden}
.splash::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 65%);top:-140px;right:-160px;opacity:.55}
.splash::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--accent-2) 0%,transparent 65%);bottom:80px;left:-150px;opacity:.3}
.splash > *{position:relative;z-index:1}
.wordmark{font-weight:900;font-size:52px;letter-spacing:-2px;line-height:1.05;margin-top:18px;overflow-wrap:anywhere}
.tag{margin-top:10px;font-size:18px;color:#D6D8E8;font-weight:500}
.welcome{margin-top:18px;color:#D6D8E8;font-size:15px;white-space:pre-wrap;max-width:36ch}
.btn-google{width:100%;background:#fff;color:#1B1F3B;border-radius:14px;padding:16px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-google svg{width:20px;height:20px}
.fine{margin-top:14px;font-size:13px;color:#A9ACC2;text-align:center}
.e2e{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#C9C3FF;background:rgba(255,255,255,.08);padding:5px 10px;border-radius:999px;margin-top:16px}
.e2e svg{width:14px;height:14px}

/* form screens (keys, home) */
.page{flex:1;overflow-y:auto;padding:calc(28px + var(--safe-t)) 20px calc(28px + var(--safe-b))}
.page h2{font-size:26px;letter-spacing:-.5px;margin:14px 0 8px;line-height:1.2;text-wrap:balance}
.page p.lead{color:var(--ink-2);margin:0 0 18px}
.lockhero{width:56px;height:56px;border-radius:16px;background:var(--lock-soft);color:var(--lock);display:flex;align-items:center;justify-content:center}
.lockhero svg{width:28px;height:28px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:84px;resize:vertical}
.hint{font-size:13px;color:var(--ink-3);margin-top:6px}
.err{font-size:13.5px;color:var(--danger);margin-top:8px;min-height:1em}
.btn{width:100%;padding:14px;border-radius:12px;font-weight:700;background:var(--ink);color:var(--bg);margin-top:12px}
.btn.accent{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4}
.btn.secondary{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.linkish{color:var(--ink-3);font-size:14px;text-decoration:underline;margin-top:16px;display:block;width:100%;text-align:center}
.group-row{display:flex;align-items:center;gap:12px;padding:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.group-row .info{flex:1;min-width:0}
.group-row .nm{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-row .sub{font-size:13px;color:var(--ink-3)}
.invite-card{background:var(--night);color:#fff;border-radius:20px;padding:20px;margin-bottom:18px;position:relative;overflow:hidden}
.invite-card::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 65%);top:-120px;right:-110px;opacity:.5}
.invite-card > *{position:relative}
.invite-card h3{margin:12px 0 2px;font-size:22px}
.invite-card p{margin:0;color:#D6D8E8;font-size:14.5px;white-space:pre-wrap}
.divider{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px;font-weight:700;letter-spacing:.5px;margin:22px 0 12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* pending */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px}
.center h2{margin:16px 0 6px;font-size:22px}
.center p{margin:0;color:var(--ink-2);white-space:pre-wrap}

/* header */
header.top{padding:calc(12px + var(--safe-t)) 12px 10px 16px;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);min-height:58px}
header.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top h1 small{display:block;font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:0;margin-top:-2px}
body.in-room header.top h1{font-size:18px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
#btnBack{margin-left:-8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.group{background:var(--group);border-radius:12px}

/* views */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.view{padding:16px 16px 24px}
.view.room{padding:0;display:flex;flex-direction:column;height:100%}

/* announcements */
.compose-btn{width:100%;border:1.5px dashed var(--line);border-radius:14px;padding:14px;color:var(--ink-2);font-weight:600;margin-bottom:14px;background:var(--card)}
.ann{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--line);position:relative}
.ann.new::before{content:"NEW";position:absolute;top:-8px;left:14px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.5px}
.ann.pinned{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ann h3{margin:0 0 6px;font-size:17px;line-height:1.35;text-wrap:balance}
.ann .body{white-space:pre-wrap;color:var(--ink-2);font-size:15px;overflow-wrap:anywhere}
.ann .meta{margin-top:10px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:color-mix(in srgb, var(--danger) 14%, var(--card));color:var(--danger)}
.link-btn{font-size:13px;color:var(--ink-3);padding:4px 6px}
.link-btn.danger{color:var(--danger)}
.empty{text-align:center;color:var(--ink-3);padding:48px 16px}
.locked{font-style:italic;color:var(--ink-3)}

/* chat list */
.rooms{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.room-row{display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.room-row:last-child{border-bottom:0}
.room-row .avatar,.room-row .brandmark{width:46px;height:46px;font-size:15px}
.room-row .brandmark{border-radius:12px;font-size:12px}
.room-row .mid{flex:1;min-width:0}
.room-row .t{font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
.room-row .t span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-row .t svg{width:14px;height:14px;color:var(--lock);flex-shrink:0}
.room-row .p{font-size:14px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-row.unread .p{color:var(--ink);font-weight:600}
.room-row .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.room-row .when{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.room-row .ud{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.list-note{font-size:12.5px;color:var(--ink-3);margin:12px 4px 0;display:flex;gap:6px;align-items:flex-start}
.list-note svg{width:14px;height:14px;margin-top:3px;color:var(--lock)}

/* room */
.guideline{margin:12px 16px 0;font-size:12.5px;text-align:center;border-radius:10px;padding:8px 12px;background:var(--lock-soft);color:var(--lock)}
#msgList{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:2px;min-height:0}
.day{align-self:center;font-size:12px;color:var(--ink-3);margin:12px 0 6px;background:var(--card);padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.msg{display:flex;gap:8px;max-width:86%;align-items:flex-end;margin-top:6px}
.msg.cont{margin-top:0}
.msg > .col{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.msg.me > .col{align-items:flex-end}
.msg .avatar{width:30px;height:30px;font-size:12px}
.msg.cont .avatar{visibility:hidden}
.msg .who{font-size:12px;color:var(--ink-3);margin:0 0 2px 4px;font-weight:600}
.msg .who .lead{color:var(--accent)}
.bubble{overflow-wrap:anywhere;background:var(--theirs);border:1px solid var(--line);padding:9px 13px;border-radius:18px 18px 18px 6px;white-space:pre-wrap;font-size:15.5px;cursor:pointer}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bubble{background:var(--mine);color:var(--mine-ink);border-color:transparent;border-radius:18px 18px 6px 18px}
.bubble.media{padding:0;overflow:hidden;background:transparent;border:0;border-radius:16px}
.bubble.media img,.bubble.media video{display:block;max-width:min(240px,62vw);max-height:320px;border-radius:16px;background:var(--line)}
.bubble.media .ph{width:200px;height:150px;border-radius:16px;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px}
.msg.me .bubble.media{background:transparent}
.filecard{display:flex;gap:10px;align-items:center;min-width:180px;max-width:240px;text-align:left}
.filecard .fi{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:800}
.msg.me .filecard .fi{background:rgba(255,255,255,.16);color:inherit}
.filecard .fn{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filecard .fs{font-size:12px;opacity:.7}
.filecard > div:last-child{min-width:0}
.uploading{font-size:13px;color:var(--ink-3);align-self:flex-end;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:8px 12px;margin-top:6px}
.uploading .bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden;width:180px}
.uploading .bar i{display:block;height:100%;background:var(--accent);width:0}
.msg .time{font-size:11px;color:var(--ink-3);white-space:nowrap;padding-bottom:3px}
.msg .acts{display:none;gap:6px;margin-top:4px}
.msg.sel .acts{display:flex}
.msg.sel .bubble{outline:2px solid var(--accent);outline-offset:1px}
.act{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-2)}
.act.danger{color:var(--danger)}
.composer{display:flex;gap:6px;padding:10px 12px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg);align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:10px 14px;max-height:120px;outline:none;line-height:1.4}
.composer textarea:focus{border-color:var(--accent)}
.attach{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex-shrink:0}
.send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send:disabled{opacity:.4}
.send svg{width:20px;height:20px}

/* manage */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:8px 2px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg .n{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:999px;background:var(--accent);color:#fff;font-size:10.5px;line-height:16px}
.sec-title{font-size:13px;font-weight:800;color:var(--ink-3);letter-spacing:.5px;margin:18px 4px 8px}
.sec-title:first-child{margin-top:0}
.person{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.person .info{flex:1;min-width:0}
.person .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .email{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;white-space:nowrap}
.pill.ok{background:var(--ok);color:#fff}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.pill.no{color:var(--danger)}
.actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.report .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.report .when{font-size:12px;color:var(--ink-3);margin-left:auto}
.report .quote{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.report .quote img{display:block;max-width:180px;border-radius:10px;margin-top:6px}
.report .meta{font-size:13px;color:var(--ink-2)}
.report .note{font-size:13.5px;color:var(--ink-2);margin-top:6px}
.code-box{font-size:26px;font-weight:900;letter-spacing:3px;text-align:center;padding:14px;border-radius:12px;background:var(--bg);font-variant-numeric:tabular-nums;margin:6px 0 10px;overflow-wrap:anywhere}
.linkline{font-size:13px;color:var(--ink-2);background:var(--bg);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;user-select:all}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 8px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line);display:block}
.sw.on{border-color:var(--card);box-shadow:0 0 0 2px var(--ink)}
.sw input{opacity:0;width:100%;height:100%;cursor:pointer}
.sw.custom{background:conic-gradient(#f43,#fb3,#3c6,#39f,#a4f,#f43);position:relative;overflow:hidden}
.logo-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.preview{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.preview .pv-head{background:var(--night);color:#fff;padding:16px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden}
.preview .pv-head::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--pv-accent) 0%,transparent 65%);top:-100px;right:-80px;opacity:.6}
.preview .pv-head > *{position:relative}
.preview .pv-name{font-weight:900;font-size:20px}
.preview .pv-tag{font-size:13px;color:#D6D8E8}
.preview .pv-body{padding:12px 16px;background:var(--bg);display:flex;justify-content:flex-end}
.preview .pv-bubble{background:var(--pv-accent);color:#fff;border-radius:18px 18px 6px 18px;padding:8px 12px;font-size:14px}

/* tabs */
nav.tabs{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--ink-3);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{color:var(--accent)}
.dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
body.in-room nav.tabs{display:none}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;max-height:88dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + var(--safe-b))}
.sheet .scroll{overflow-y:auto;min-height:0;flex:1;margin:0 -16px;padding:0 16px}
.sheet h3{margin:0 0 14px;font-size:18px}
.sheet input[type=text],.sheet input:not([type]),.sheet textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none;margin-bottom:10px}

/* ============================================================
   2) End-to-end encryption (runs on each phone; the server only ever sees scrambled data)
   - Every phone/computer has its own key pair. The private half never leaves that device.
     A new device gets the keys from other members' apps automatically — nothing to type.
   - Every chat has its own secret key, handed to each member locked with that member's public key.
   - The group-wide key (main chat + announcements) is handed out the same way by members' apps.
   ============================================================ */
const C = (() => {
  const subtle = crypto.subtle, te = new TextEncoder(), td = new TextDecoder();
  const EC = { name: "ECDH", namedCurve: "P-256" };
  const AES = { name: "AES-GCM", length: 256 };
  const rand = n => crypto.getRandomValues(new Uint8Array(n));
  const b64 = buf => { const b = new Uint8Array(buf); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const pubOf = j => ({ kty: "EC", crv: "P-256", x: j.x, y: j.y });
  async function fp(pub){
    const h = new Uint8Array(await subtle.digest("SHA-256", te.encode(pub.x + "." + pub.y)));
    return [...h.slice(0, 10)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  async function genUser(){
    const kp = await subtle.generateKey(EC, true, ["deriveKey"]);
    const privJwk = await subtle.exportKey("jwk", kp.privateKey);
    const pub = pubOf(await subtle.exportKey("jwk", kp.publicKey));
    return { privJwk, pub, fp: await fp(pub) };
  }
  const importPriv = jwk => subtle.importKey("jwk", jwk, EC, false, ["deriveKey"]);
  const importPub = jwk => subtle.importKey("jwk", pubOf(jwk), EC, true, []);
  async function passKey(pass, salt, iter){
    const base = await subtle.importKey("raw", te.encode(pass.normalize("NFKC")), "PBKDF2", false, ["deriveKey"]);
    return subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, AES, false, ["encrypt", "decrypt"]);
  }
  async function backup(privJwk, pass){
    const salt = rand(16), iv = rand(12), iter = 600000;
    const k = await passKey(pass, salt, iter);
    const ct = await subtle.encrypt({ name: "AES-GCM", iv }, k, te.encode(JSON.stringify(privJwk)));
    return { v: 1, iter, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
  }
  async function restore(bk, pass){
    const k = await passKey(pass, unb64(bk.salt), bk.iter);
    const pt = await subtle.decrypt({ name: "AES-GCM", iv: unb64(bk.iv) }, k, unb64(bk.ct));
    return JSON.parse(td.decode(pt));
  }
  const newKey = () => subtle.generateKey(AES, true, ["encrypt", "decrypt"]);
  async function wrap(sym, pub){
    const eph = await subtle.generateKey(EC, true, ["deriveKey"]);
    const shared = await subtle.deriveKey({ name: "ECDH", public: await importPub(pub) }, eph.privateKey, AES, false, ["encrypt"]);
    const iv = rand(12);
    const ct = await subtle.encrypt({ name: "AES-GCM", iv }, shared, await subtle.exportKey("raw", sym));
    const e = await subtle.exportKey("jwk", eph.publicKey);
    return { ex: e.x, ey: e.y, iv: b64(iv), ct: b64(ct), for: await fp(pub) };
  }
  async function unwrap(w, priv){
    const shared = await subtle.deriveKey({ name: "ECDH", public: await importPub({ x: w.ex, y: w.ey }) }, priv, AES, false, ["decrypt"]);
    const raw = await subtle.decrypt({ name: "AES-GCM", iv: unb64(w.iv) }, shared, unb64(w.ct));
    return subtle.importKey("raw", raw, "AES-GCM", true, ["encrypt", "decrypt"]);
  }
  async function seal(sym, obj){
    const iv = rand(12);
    const ct = await subtle.encrypt({ name: "AES-GCM", iv }, sym, te.encode(JSON.stringify(obj)));
    return { iv: b64(iv), ct: b64(ct) };
  }
  async function open(sym, box){
    const pt = await subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, sym, unb64(box.ct));
    return JSON.parse(td.decode(pt));
  }
  async function sealBytes(sym, buf){ const iv = rand(12); return { iv: b64(iv), data: await subtle.encrypt({ name: "AES-GCM", iv }, sym, buf) }; }
  const openBytes = (sym, iv, buf) => subtle.decrypt({ name: "AES-GCM", iv: unb64(iv) }, sym, buf);
  return { fp, genUser, importPriv, backup, restore, newKey, wrap, unwrap, seal, open, sealBytes, openBytes, b64, unb64 };
})();
const keyStore = (() => {
  const db = () => new Promise((ok, no) => {
    const r = indexedDB.open("gather-keys", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("k");
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
  const run = async (mode, fn) => {
    const d = await db();
    return new Promise((ok, no) => { const t = d.transaction("k", mode); const q = fn(t.objectStore("k")); t.oncomplete = () => ok(q.result); t.onerror = () => no(t.error); });
  };
  return { get: k => run("readonly", s => s.get(k)), set: (k, v) => run("readwrite", s => s.put(v, k)) };
})();

/* ---------- icons ---------- */

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch{ return d; } },

const fmtTime = ms => new Date(ms).toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit"});
const fmtDay = ms => new Date(ms).toLocaleDateString("en-US", {weekday:"short", month:"long", day:"numeric"});

const brandLetters = n => { const w = n.trim().split(/\s+/).filter(Boolean); if (w.length > 1) return w.slice(0, 3).map(x => x[0]).join("").toUpperCase(); return n.length <= 4 ? n.toUpperCase() : n[0].toUpperCase(); };

const randCode = n => { const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = crypto.getRandomValues(new Uint8Array(n)); return [...r].map(x => a[x % a.length]).join(""); };

function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }

async function copyText(t){ try { await navigator.clipboard.writeText(t); toast("Copied"); } catch { toast("Press and hold the link to copy it"); } }
const loadImage = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
// Shrink big photos before upload so they send fast
async function prepImage(file){
  if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)) return { blob: file, name: file.name, type: file.type || "application/octet-stream" };
  try {
    const url = URL.createObjectURL(file), img = await loadImage(url);
    const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    return blob ? { blob, name: file.name.replace(/\.[^.]+$/, "") + ".jpg", type: "image/jpeg" } : { blob: file, name: file.name, type: file.type };
  } catch { return { blob: file, name: file.name, type: file.type }; }
}
async function squareImage(src, size, type = "image/jpeg", q = .85){
  const img = await loadImage(src), s = Math.min(img.naturalWidth, img.naturalHeight);
  const c = document.createElement("canvas"); c.width = c.height = size;
  c.getContext("2d").drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
  return c.toDataURL(type, q);
}
async function thumbOf(src){
  try { const img = await loadImage(src), s = Math.min(1, 360 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", .7); } catch { return ""; }
}
function previewText(text, file){
  if (text) return text.slice(0, 80);
  if (!file) return "";
  if (file.type?.startsWith("image/")) return "📷 Photo";
  if (file.type?.startsWith("video/")) return "🎬 Video";
  return "📎 " + file.name;
}

/* ============================================================
   3) Data layer — live Firebase (encrypted) and preview mode share one interface.
      Everything below the data layer only ever sees decrypted objects.
   ============================================================ */
let api;

async function firebaseApi(){
  const V = "10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app), db = F.getFirestore(app);
  const provider = new A.GoogleAuthProvider(); provider.setCustomParameters({ prompt: "select_account" });
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  A.getRedirectResult(auth).catch(e => console.warn(e));
  const d = (...p) => F.doc(db, ...p), col = (...p) => F.collection(db, ...p);
  const ts = F.serverTimestamp;

  let user = null, acct = null, K = null;                 // K = this device's keys { priv, pub, fp, dev }
  let cid = null, H = null, subsMe = [], subsIn = [], roomSub = null;
  let myRole = null, churchKey = null, ckSeen = null, members = {}, rawAnns = [], rawReports = [], mineRooms = [], mainRoom = null;
  const roomKeyCache = {}, msgCache = new Map(), media = new Map();
  const unsubAll = a => { a.forEach(u => u()); a.length = 0; };
  const rawRoom = rid => rid === "main" ? mainRoom : mineRooms.find(x => x.id === rid);

  // Every phone/computer makes its own key pair the first time it signs in. No passphrase:
  // other members' apps automatically share chat keys with each new device (see heal()).
  async function ensureKeys(){
    let local = await keyStore.get(user.uid).catch(() => null);
    if (!local?.dev){
      const g = await C.genUser();
      local = { priv: await C.importPriv(g.privJwk), pub: g.pub, fp: g.fp, dev: randCode(8) };
      await keyStore.set(user.uid, local).catch(() => {});
    }
    K = local;
  }
  const myDevs = () => ({ [K.dev]: { pub: JSON.stringify(K.pub), fp: K.fp } });
  const devsOf = u => u === user.uid ? { ...(members[u]?.devs || {}), ...myDevs() } : (members[u]?.devs || {});
  // lock a key for every device a person uses (reusing locks that are still valid)
  async function wrapForDevs(key, devs, prev = {}){
    const out = {};
    for (const [dev, v] of Object.entries(devs || {})){ const w = prev?.[dev]; out[dev] = w && w.for === v.fp ? w : await C.wrap(key, JSON.parse(v.pub)); }
    return out;
  }

  async function roomKey(r){
    if (!r) return null;
    if (r.type === "main") return churchKey;
    const w = r.wk?.[user.uid]?.[K.dev];
    if (!w || w.for !== K.fp) return null;
    const c = roomKeyCache[r.id];
    if (c && c.ct === w.ct) return c.key;
    try { const key = await C.unwrap(w, K.priv); roomKeyCache[r.id] = { ct: w.ct, key }; return key; } catch { return null; }
  }
  const tryOpen = async (key, box) => { if (!key || !box?.ct) return null; try { return await C.open(key, box); } catch { return null; } };

  async function emitAnns(){
    const list = await Promise.all(rawAnns.map(async a => {
      const p = await tryOpen(churchKey, a);
      return { id: a.id, uid: a.uid, pinned: a.pinned, at: toMs(a.createdAt), title: p?.title || "", body: p?.body || "", locked: !p };
    }));
    H?.anns(list);
  }
  async function emitRooms(){
    const raws = (mainRoom ? [mainRoom] : []).concat(mineRooms);
    const list = await Promise.all(raws.map(async r => {
      const key = await roomKey(r);
      const nm = r.type === "group" ? await tryOpen(key, r.nameEnc) : null;
      const last = await tryOpen(key, r.lastEnc);
      return { id: r.id, type: r.type, members: r.members || [], createdBy: r.createdBy, name: nm?.n || (r.type === "group" ? "Private group" : ""),
        lastAt: r.lastAt ? toMs(r.lastAt) : 0, lastUid: r.lastUid || "", lastText: last?.t || "", locked: !key };
    }));
    H?.rooms(list);
    heal();
  }
  async function emitReports(){
    const list = await Promise.all(rawReports.map(async r => {
      let p = null;
      const w = r.wk?.[user.uid]?.[K.dev];
      if (w && w.for === K.fp) { try { p = await C.open(await C.unwrap(w, K.priv), r); } catch {} }
      return { id: r.id, at: toMs(r.createdAt), reporter: r.reporter, locked: !p, ...(p || {}) };
    }));
    H?.reports(list);
  }

  // Share keys with any device that's missing them (newly approved people, new phones/computers).
  // Any approved member who has a key can share it, so no one gets stuck.
  let healT = null;
  function heal(){ clearTimeout(healT); healT = setTimeout(healNow, 900); }
  async function healNow(){
    if (!K || !["member","leader"].includes(myRole)) return;
    if (churchKey){
      for (const [id, m] of Object.entries(members)){
        if (!["member","leader"].includes(m.role)) continue;
        const upd = {};
        for (const [dev, v] of Object.entries(m.devs || {})) if (m.ck?.[dev]?.for !== v.fp) upd["ck." + dev] = await C.wrap(churchKey, JSON.parse(v.pub));
        if (Object.keys(upd).length) await F.updateDoc(d("churches", cid, "members", id), upd).catch(e => console.warn(e));
      }
    }
    for (const r of mineRooms){
      const key = await roomKey(r); if (!key) continue;
      const upd = {};
      for (const id of r.members){
        if (!["member","leader"].includes(members[id]?.role)) continue;
        for (const [dev, v] of Object.entries(devsOf(id))) if (r.wk?.[id]?.[dev]?.for !== v.fp) upd[`wk.${id}.${dev}`] = await C.wrap(key, JSON.parse(v.pub));
      }
      if (Object.keys(upd).length) F.updateDoc(d("churches", cid, "rooms", r.id), upd).catch(e => console.warn(e));
    }
  }

  function attachInside(){
    unsubAll(subsIn);
    const base = ["churches", cid];
    subsIn.push(F.onSnapshot(d(...base), s => s.exists() && H?.church({ id: s.id, ...s.data() })));
    subsIn.push(F.onSnapshot(F.query(col(...base, "announcements"), F.orderBy("createdAt", "desc"), F.limit(50)), s => { rawAnns = s.docs.map(x => ({ id: x.id, ...x.data() })); emitAnns(); }));
    const memQ = myRole === "leader" ? col(...base, "members") : F.query(col(...base, "members"), F.where("role", "in", ["member", "leader"]));
    subsIn.push(F.onSnapshot(memQ, s => {
      members = Object.fromEntries(s.docs.map(x => [x.id, x.data()]));
      H?.members(Object.fromEntries(s.docs.map(x => { const m = x.data(); return [x.id, { name: m.name, photo: m.photo || "", role: m.role, at: toMs(m.joinedAt) }]; })));
      heal();
    }));
    subsIn.push(F.onSnapshot(F.query(col(...base, "rooms"), F.where("members", "array-contains", user.uid)), s => { mineRooms = s.docs.map(x => ({ id: x.id, ...x.data() })); emitRooms(); }));
    subsIn.push(F.onSnapshot(d(...base, "rooms", "main"), s => { mainRoom = s.exists() ? { id: s.id, ...s.data() } : null; emitRooms(); }, e => console.warn(e)));
    if (myRole === "leader"){
      subsIn.push(F.onSnapshot(col(...base, "contacts"), s => H?.contacts(Object.fromEntries(s.docs.map(x => [x.id, x.data().email])))));
      subsIn.push(F.onSnapshot(F.query(col(...base, "reports"), F.orderBy("createdAt", "desc")), s => { rawReports = s.docs.map(x => ({ id: x.id, ...x.data() })); emitReports(); }));
    }
  }

  // Files are encrypted on the phone, then split into ~600 KB pieces stored in the database.
  // This keeps everything on Firebase's free plan (no separate file storage needed).
  const PART = 600 * 1024;
  const fcol = rid => col("churches", cid, "rooms", rid, "files");
  async function delFile(rid, f){
    if (!f?.path) return;
    for (let i = 0; i < (f.parts || 1); i++) await F.deleteDoc(F.doc(fcol(rid), f.path, "parts", String(i))).catch(() => {});
    await F.deleteDoc(F.doc(fcol(rid), f.path)).catch(() => {});
  }

  return {
    async login(){
      if (standalone) return A.signInWithRedirect(auth, provider);
      try { await A.signInWithPopup(auth, provider); }
      catch(e){
        if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code)) return A.signInWithRedirect(auth, provider);
        if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast("Sign-in failed: " + e.code);
      }
    },
    logout(){ this.closeChurch(); return A.signOut(auth); },
    onAuth(cb){ A.onAuthStateChanged(auth, u => { user = u; K = null; acct = null; cb(u ? { uid: u.uid, email: u.email, name: u.displayName || "", photo: u.photoURL || "" } : null); }); },
    async account(){
      await ensureKeys();
      const s = await F.getDoc(d("users", user.uid)); acct = s.exists() ? s.data() : null;
      return { keyStatus: "ready", groups: acct?.groups || {} };
    },
    async previewInvite(code){ const s = await F.getDoc(d("invites", code)).catch(() => null); return s?.exists() ? s.data() : null; },
    async joinChurch(code){
      const inv = await this.previewInvite(code); if (!inv) throw new Error("bad-code");
      const c = inv.churchId;
      const exists = await F.getDoc(d("churches", c, "members", user.uid)).then(s => s.exists()).catch(() => false);
      const b = F.writeBatch(db);
      if (!exists) b.set(d("churches", c, "members", user.uid), { name: (user.displayName || "New member").slice(0, 30), photo: user.photoURL || "", role: "pending", devs: myDevs(), invite: code, joinedAt: ts() });
      b.set(d("churches", c, "contacts", user.uid), { email: user.email || "" });
      b.set(d("users", user.uid), { groups: { [c]: { name: inv.name, accent: inv.accent || "", logo: inv.logo || "", welcome: inv.welcome || "" } } }, { merge: true });
      await b.commit();
      return c;
    },
    async createChurch(name){
      const c = F.doc(col("churches")).id, code = randCode(10), key = await C.newKey(), theme = defaultTheme(name);
      const b = F.writeBatch(db);
      b.set(d("churches", c), { name, createdBy: user.uid, createdAt: ts(), theme, invite: code });
      b.set(d("churches", c, "members", user.uid), { name: (user.displayName || "Leader").slice(0, 30), photo: user.photoURL || "", role: "leader", devs: myDevs(), ck: { [K.dev]: await C.wrap(key, K.pub) }, joinedAt: ts() });
      b.set(d("churches", c, "contacts", user.uid), { email: user.email || "" });
      b.set(d("churches", c, "rooms", "main"), { type: "main", members: [], createdBy: user.uid, createdAt: ts() });
      b.set(d("invites", code), { churchId: c, name, tagline: theme.tagline, accent: theme.accent, logo: "", welcome: theme.welcome });
      b.set(d("users", user.uid), { groups: { [c]: { name, accent: theme.accent, logo: "", welcome: theme.welcome } } }, { merge: true });
      await b.commit();
      return c;
    },
    openChurch(c, handlers){
      this.closeChurch();
      cid = c; H = handlers; myRole = null; churchKey = null; ckSeen = null; members = {};
      subsMe.push(F.onSnapshot(d("churches", c, "members", user.uid), async s => {
        const m = s.exists() ? s.data() : null;
        // make sure this device is listed so others can share keys with it
        if (m && m.role !== "removed" && m.devs?.[K.dev]?.fp !== K.fp){
          const upd = { ["devs." + K.dev]: { pub: JSON.stringify(K.pub), fp: K.fp } };
          const others = Object.keys(m.devs || {}).filter(x => x !== K.dev);
          if (others.length >= 8) upd["devs." + others[0]] = F.deleteField();   // keep the list short
          F.updateDoc(d("churches", c, "members", user.uid), upd).catch(e => console.warn(e));
        }
        const myCk = m?.ck?.[K.dev];
        if (myCk && myCk.for === K.fp && myCk.ct !== ckSeen){
          try { churchKey = await C.unwrap(myCk, K.priv); ckSeen = myCk.ct; emitAnns(); emitRooms(); } catch(e){ console.warn(e); }
        }
        const role = m?.role || null, changed = role !== myRole;
        myRole = role;
        if (changed){ unsubAll(subsIn); if (role === "member" || role === "leader") attachInside(); }
        H?.me(m ? { name: m.name, photo: m.photo || "", role: m.role } : null);
      }, e => { console.warn(e); H?.me(null); }));
    },
    closeChurch(){ unsubAll(subsMe); unsubAll(subsIn); roomSub?.(); roomSub = null; cid = null; H = null; rawAnns = []; rawReports = []; mineRooms = []; mainRoom = null; members = {}; },
    watchRoom(rid, cb){
      roomSub?.();
      roomSub = F.onSnapshot(F.query(col("churches", cid, "rooms", rid, "messages"), F.orderBy("createdAt", "desc"), F.limit(MSG_LIMIT)), async s => {
        const key = await roomKey(rawRoom(rid));
        const list = await Promise.all(s.docs.map(async x => {
          const v = x.data(), k = x.id + ":" + v.ct?.length + ":" + !!key;
          if (msgCache.has(k)) return msgCache.get(k);
          const p = await tryOpen(key, v);
          const m = { id: x.id, uid: v.uid, at: toMs(v.createdAt), text: p?.t || "", file: p?.f || null, locked: !p };
          if (p && v.createdAt) msgCache.set(k, m);
          return m;
        }));
        cb(list.reverse());
      }, e => { console.warn(e); toast("Couldn't open this chat."); });
      return () => { roomSub?.(); roomSub = null; };
    },
    async addAnn(title, body, pinned){
      if (!churchKey) throw new Error("no-key");
      await F.addDoc(col("churches", cid, "announcements"), { uid: user.uid, pinned: !!pinned, ...(await C.seal(churchKey, { title, body })), createdAt: ts() });
    },
    delAnn: id => F.deleteDoc(d("churches", cid, "announcements", id)),
    async upload(rid, blob, name, onProgress){
      const key = await roomKey(rawRoom(rid)); if (!key) throw new Error("no-key");
      const { iv, data } = await C.sealBytes(key, await blob.arrayBuffer());
      const bytes = new Uint8Array(data), n = Math.max(1, Math.ceil(bytes.length / PART));
      const fref = F.doc(fcol(rid));
      await F.setDoc(fref, { uid: user.uid, n, size: bytes.length, createdAt: ts() });
      for (let i = 0; i < n; i++){
        await F.setDoc(F.doc(fref, "parts", String(i)), { d: C.b64(bytes.subarray(i * PART, (i + 1) * PART)) });
        onProgress((i + 1) / n);
      }
      return { path: fref.id, iv, parts: n };
    },
    // download the pieces, join them, decrypt for display
    async fileUrl(rid, f){
      if (media.has(f.path)) return media.get(f.path);
      const key = await roomKey(rawRoom(rid)); if (!key) throw new Error("no-key");
      const snaps = await Promise.all(Array.from({ length: f.parts || 1 }, (_, i) => F.getDoc(F.doc(fcol(rid), f.path, "parts", String(i)))));
      const pieces = snaps.map(s => { if (!s.exists()) throw new Error("missing-part"); return C.unb64(s.data().d); });
      const all = new Uint8Array(pieces.reduce((a, p) => a + p.length, 0));
      let o = 0; for (const p of pieces){ all.set(p, o); o += p.length; }
      const buf = all.buffer;
      const url = URL.createObjectURL(new Blob([await C.openBytes(key, f.iv, buf)], { type: f.type || "application/octet-stream" }));
      media.set(f.path, url); return url;
    },
    async send(rid, text, file){
      const key = await roomKey(rawRoom(rid)); if (!key) throw new Error("no-key");
      const b = F.writeBatch(db);
      b.set(F.doc(col("churches", cid, "rooms", rid, "messages")), { uid: user.uid, ...(await C.seal(key, { t: text, f: file || null })), createdAt: ts() });
      b.update(d("churches", cid, "rooms", rid), { lastAt: ts(), lastUid: user.uid, lastEnc: await C.seal(key, { t: previewText(text, file) }) });
      await b.commit();
    },
    async delMsg(rid, m){
      await F.deleteDoc(d("churches", cid, "rooms", rid, "messages", m.id));
      if (m.file?.path) delFile(rid, m.file);
    },
    async openDM(other){
      const id = dmId(user.uid, other);
      if (!mineRooms.some(r => r.id === id)){
        const key = await C.newKey(), mem = [user.uid, other].sort(), wk = {};
        for (const u of mem) wk[u] = await wrapForDevs(key, devsOf(u));
        await F.setDoc(d("churches", cid, "rooms", id), { type: "dm", members: mem, createdBy: user.uid, createdAt: ts(), wk }).catch(e => console.warn(e));
      }
      return id;
    },
    async createGroup(name, uids){
      const key = await C.newKey(), mem = [...new Set([user.uid, ...uids])], wk = {};
      for (const u of mem) wk[u] = await wrapForDevs(key, devsOf(u));
      const ref = F.doc(col("churches", cid, "rooms"));
      await F.setDoc(ref, { type: "group", members: mem, createdBy: user.uid, createdAt: ts(), wk, nameEnc: await C.seal(key, { n: name }) });
      return ref.id;
    },
    async updateGroup(rid, { name, members: mem }){
      const r = rawRoom(rid), key = await roomKey(r); if (!key) throw new Error("no-key");
      const upd = {};
      if (name !== undefined) upd.nameEnc = await C.seal(key, { n: name });
      if (mem){
        upd.members = mem;
        const wk = {};
        for (const u of mem) wk[u] = await wrapForDevs(key, devsOf(u), r.wk?.[u]);
        upd.wk = wk;
      }
      await F.updateDoc(d("churches", cid, "rooms", rid), upd);
    },
    leaveGroup: rid => F.updateDoc(d("churches", cid, "rooms", rid), { members: F.arrayRemove(user.uid), ["wk." + user.uid]: F.deleteField() }),
    async deleteGroup(rid){
      const key = await roomKey(rawRoom(rid));
      const s = await F.getDocs(col("churches", cid, "rooms", rid, "messages"));
      for (const x of s.docs){
        const p = await tryOpen(key, x.data());
        if (p?.f?.path) await delFile(rid, p.f);
        await F.deleteDoc(x.ref);
      }
      await F.deleteDoc(d("churches", cid, "rooms", rid));
    },
    setRole: (uid, role) => F.updateDoc(d("churches", cid, "members", uid), { role }),
    setName: name => F.updateDoc(d("churches", cid, "members", user.uid), { name }),
    async saveTheme(theme, invite){
      const b = F.writeBatch(db);
      b.update(d("churches", cid), { theme, name: theme.name });
      b.set(d("invites", invite), { churchId: cid, name: theme.name, tagline: theme.tagline, accent: theme.accent, logo: theme.logo, welcome: theme.welcome });
      await b.commit();
    },
    async newInvite(theme, old){
      const code = randCode(10), b = F.writeBatch(db);
      b.set(d("invites", code), { churchId: cid, name: theme.name, tagline: theme.tagline, accent: theme.accent, logo: theme.logo, welcome: theme.welcome });
      if (old) b.delete(d("invites", old));
      b.update(d("churches", cid), { invite: code });
      await b.commit();
      return code;
    },
    async report(payload){
      const key = await C.newKey(), wk = {};
      for (const [id, m] of Object.entries(members)) if (m.role === "leader" && m.devs) wk[id] = await wrapForDevs(key, m.devs);
      if (!Object.keys(wk).length) throw new Error("no-leaders");
      await F.addDoc(col("churches", cid, "reports"), { reporter: user.uid, wk, ...(await C.seal(key, payload)), createdAt: ts() });
    },
    dismissReport: id => F.deleteDoc(d("churches", cid, "reports", id))
  };
}

    g1: [ m("me","Setlist for Sunday is up. Please practice the bridge on song 2!",5*Hr), m("me","",5*Hr-M,{ url:"#", name:"Sunday Setlist.pdf", type:"application/pdf", size:412000 }), m("u2","got it 👍",3*Hr) ],
    g2: [ m("u2","who's bringing chips?",2*D), m("u6","me! and drinks",2*D-10*M), m("u3","I'll do s'mores stuff 🔥",20*Hr) ],

    dm_u1_u3: [ m("u3","did you finish the youth group sign up?",70*M), m("u1","yep just did",65*M) ]
  };
  ch.reports = [{ id:"r1", at: now-40*M, reporter:"u6", reason:"Bullying or mean", note:"This keeps happening in our group.", room:"Outing Snack Squad",
    msg:{ uid:"u3", name:"Joshua", text:"lol nobody wants you there anyway", at: now-50*M } }];
  const last = (c, id) => { const l = c.msgs[id]?.at(-1); Object.assign(c.rooms[id], l ? { lastAt: l.at, lastUid: l.uid, lastText: previewText(l.text, l.file) } : { lastAt: 0, lastUid:"", lastText:"" }); };
  Object.keys(ch.rooms).forEach(id => last(ch, id));

  const c = () => churches[cur];
  const myRole = () => c()?.members[uid()]?.role;
  const groupsOf = u => Object.fromEntries(Object.keys(accounts[u]).map(id => { const t = churches[id].theme; return [id, { name: t.name, accent: t.accent, logo: t.logo, welcome: t.welcome }]; }));
  const push = () => {
    if (!H || !c()) return;
    const k = c(), role = myRole();
    H.me(k.members[uid()] ? { name: users[uid()].name, photo:"", role, fp:"a41c09e7d2b85f3e61d0" } : null);
    if (!["member","leader"].includes(role)) return;
    H.church({ id: k.id, name: k.name, createdBy: k.createdBy, invite: k.invite, theme: { ...k.theme } });
    H.anns(k.anns.map(a => ({ ...a })));
    H.members(Object.fromEntries(Object.entries(k.members).filter(([, v]) => role === "leader" || ["member","leader"].includes(v.role)).map(([id, v]) => [id, { name: users[id].name, photo:"", role: v.role, at: v.at }])));
    H.rooms(Object.values(k.rooms).filter(r => r.type === "main" || r.members.includes(uid())).map(r => ({ ...r, members:[...r.members] })));
    if (role === "leader"){ H.contacts(Object.fromEntries(Object.keys(k.members).map(id => [id, users[id].email]))); H.reports(k.reports.map(r => ({ ...r }))); }
  };
  const pushRoom = id => { if (roomCb && roomOpen === id) roomCb([...(c()?.msgs[id] || [])]); };
  const authUser = () => ({ uid: uid(), email: users[uid()].email, name: users[uid()].name, photo:"" });
  $("#demoBar").classList.remove("hidden");
  $("#demoRole").addEventListener("change", e => {
    const v = e.target.value;
    if (v === "out"){ cbAuth(null); return; }
    mode = v;
    if (v === "new"){ S.invite = "FGYG7K2Q9M"; S.inviteInfo = null; } else { S.invite = null; S.inviteInfo = null; }
    cbAuth(authUser());
  });
  return {
    async login(){ if (!who[mode]) mode = "leader"; $("#demoRole").value = mode; cbAuth(authUser()); },
    async logout(){ mode = "out"; $("#demoRole").value = "out"; cbAuth(null); },
    onAuth(cb){ cbAuth = cb; setTimeout(() => cb(authUser()), 0); },
    async account(){ return { keyStatus: "ready", groups: groupsOf(uid()) }; },
    async previewInvite(code){ const id = invites[code]; if (!id) return null; const t = churches[id].theme; return { churchId: id, name: t.name, tagline: t.tagline, accent: t.accent, logo: t.logo, welcome: t.welcome }; },
    async joinChurch(code){ const id = invites[code]; if (!id) throw new Error("bad-code"); const k = churches[id]; if (!k.members[uid()]) k.members[uid()] = { role:"pending", at: Date.now() }; accounts[uid()][id] = 1; return id; },
    async createChurch(name){
      const id = "c" + (++seq), code = randCode(10);
      churches[id] = { id, name, createdBy: uid(), invite: code, theme: defaultTheme(name), members: { [uid()]: { role:"leader", at: Date.now() } }, anns: [], rooms: { main: { id:"main", type:"main", members:[], createdBy: uid(), lastAt:0, lastText:"", lastUid:"" } }, msgs: { main: [] }, reports: [] };
      invites[code] = id; accounts[uid()][id] = 1; return id;
    },
    openChurch(id, h){ cur = id; H = h; setTimeout(push, 0); },
    closeChurch(){ H = null; cur = null; roomCb = null; },
    watchRoom(id, cb){ roomOpen = id; roomCb = cb; setTimeout(() => pushRoom(id), 0); return () => { roomCb = null; roomOpen = null; }; },
    async addAnn(title, body, pinned){ c().anns.push({ id:"a"+(++seq), uid: uid(), pinned, at: Date.now(), title, body }); push(); },
    async delAnn(id){ c().anns = c().anns.filter(a => a.id !== id); push(); },
    async upload(rid, blob, name, onProgress){ for (let p = .2; p <= 1.01; p += .2){ await new Promise(r => setTimeout(r, 160)); onProgress(p); } return { url: URL.createObjectURL(blob) }; },
    async fileUrl(rid, f){ return f.url; },
    async send(rid, text, file){ c().msgs[rid] = c().msgs[rid] || []; c().msgs[rid].push({ id:"m"+(++seq), uid: uid(), at: Date.now(), text, file: file || null }); last(c(), rid); push(); pushRoom(rid); },
    async delMsg(rid, msg){ c().msgs[rid] = c().msgs[rid].filter(x => x.id !== msg.id); last(c(), rid); push(); pushRoom(rid); },
    async openDM(other){ const id = dmId(uid(), other); if (!c().rooms[id]){ c().rooms[id] = { id, type:"dm", members:[uid(), other].sort(), createdBy: uid(), lastAt:0, lastText:"", lastUid:"" }; c().msgs[id] = []; push(); } return id; },
    async createGroup(name, uids){ const id = "g"+(++seq); c().rooms[id] = { id, type:"group", name, members:[...new Set([uid(), ...uids])], createdBy: uid(), lastAt:0, lastText:"", lastUid:"" }; c().msgs[id] = []; push(); return id; },
    async updateGroup(rid, data){ if (data.name !== undefined) c().rooms[rid].name = data.name; if (data.members) c().rooms[rid].members = data.members; push(); },
    async leaveGroup(rid){ c().rooms[rid].members = c().rooms[rid].members.filter(u => u !== uid()); push(); },
    async deleteGroup(rid){ delete c().rooms[rid]; delete c().msgs[rid]; push(); },
    async setRole(id, r){ c().members[id].role = r; push(); },
    async setName(n){ users[uid()].name = n; push(); },
    async saveTheme(theme){ c().theme = { ...theme }; c().name = theme.name; push(); },
    async newInvite(theme, old){ const code = randCode(10); delete invites[old]; invites[code] = cur; c().invite = code; push(); return code; },
    async report(p){ c().reports.unshift({ id:"r"+(++seq), at: Date.now(), reporter: uid(), ...p }); push(); },
    async dismissReport(id){ c().reports = c().reports.filter(r => r.id !== id); push(); }
  };
}

const S = { user:null, keyStatus:null, groups:{}, fp:"", invite:null, inviteInfo:null, cid:null, church:null, me:null, members:{}, contacts:{}, anns:[], rooms:{}, msgs:[], reports:[], tab:"ann", room:null, uploads:{}, mtab:"people" };
const isLeader = () => S.me?.role === "leader";
const theme = () => S.church?.theme || S.groups[S.cid] || null;
const nameOf = uid => S.members[uid]?.name || "Former member";
const photoOf = uid => S.members[uid]?.photo || "";
const inRoom = r => r && (r.type === "main" || (r.members || []).includes(S.user?.uid));
const mainName = () => (theme()?.name || "Group") + " Chat";
function roomTitle(r){
  if (!r) return "";
  if (r.type === "main") return mainName();
  if (r.type === "group") return r.name;
  return nameOf(r.members.find(u => u !== S.user.uid));
}
function roomAvatar(r){
  if (r.type === "main") return brandHTML(theme());
  if (r.type === "group") return `<span class="avatar group">${esc(initials(r.name))}</span>`;
  const other = r.members.find(u => u !== S.user.uid);
  return avatarHTML(nameOf(other), photoOf(other));
}
const seenKey = id => `seen:${S.cid}:${id}`;
const isUnread = r => inRoom(r) && r.lastAt && r.lastUid !== S.user?.uid && r.lastAt > store.get(seenKey(r.id), 0) && S.room !== r.id;

function applyTheme(t){
  document.documentElement.style.setProperty("--accent", t?.accent || ACCENTS[0]);
  document.title = t?.name || APP_NAME;
  const meta = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (meta) meta.content = t?.name || APP_NAME;
  const ti = $("#touchIcon"); if (ti) ti.href = t?.logo || "icons/apple-touch-icon.png";
}
function show(id){ ["scrLoading","scrLogin","scrHome","scrPending","scrMain"].forEach(s => $("#" + s).classList.toggle("hidden", s !== id)); }

/* ---------- routing ---------- */
async function onAuth(user){
  if (S.user?.uid !== user?.uid) leaveChurch();
  S.user = user;
  if (!user){ S.keyStatus = null; renderLogin(); return; }
  show("scrLoading");
  try { const a = await api.account(); S.keyStatus = a.keyStatus; S.groups = a.groups; }
  catch(e){ console.error(e); toast("Couldn't load your account. Check your connection."); return; }
  route();
}
function route(){
  if (!S.user) return renderLogin();
  if (S.invite) return renderHome();
  if (S.cid) return;
  const last = store.get("lastGroup", null), ids = Object.keys(S.groups);
  if (last && S.groups[last]) return enterChurch(last);
  if (ids.length === 1) return enterChurch(ids[0]);
  renderHome();
}
function leaveChurch(){
  if (S.room) closeRoom(true);
  api?.closeChurch();
  Object.assign(S, { cid:null, church:null, me:null, members:{}, contacts:{}, anns:[], rooms:{}, msgs:[], reports:[], tab:"ann" });
  applyTheme(null);
}
function enterChurch(cid){
  leaveChurch();
  S.cid = cid; store.set("lastGroup", cid);
  applyTheme(S.groups[cid]);
  show("scrLoading");
  api.openChurch(cid, handlers);
}

const handlers = {
  me(m){
    const prev = S.me?.role; S.me = m;
    if (!m){ toast("You're no longer in this group."); leaveChurch(); store.set("lastGroup", null); renderHome(); return; }
    if (m.role === "member" || m.role === "leader"){
      if (prev !== m.role || $("#scrMain").classList.contains("hidden")){
        show("scrMain");
        $("#tabManage").classList.toggle("hidden", m.role !== "leader");
        if (S.tab === "manage" && m.role !== "leader") S.tab = "ann";
        setTab(S.tab);
      } else { renderMeBtn(); if (S.tab === "me" && !S.room) renderMe(); }
    } else renderPending();
  },
  church(c){
    S.church = c; applyTheme(c.theme);
    S.groups[c.id] = { ...(S.groups[c.id] || {}), name: c.theme.name, accent: c.theme.accent, logo: c.theme.logo, welcome: c.theme.welcome };
    renderHeader();
    if (!S.room && !(S.tab === "manage" && S.mtab === "look")) rerenderTab();
  },
  anns(list){ S.anns = list; if (S.tab === "ann" && !S.room) renderAnn(); badges(); },
  members(map){ S.members = map; refreshChats(); if (!S.room && S.tab === "ann") renderAnn(); if (S.tab === "manage" && S.mtab !== "look" && !S.room) renderManage(); },
  contacts(map){ S.contacts = map; if (S.tab === "manage" && S.mtab === "people" && !S.room) renderManage(); },
  reports(list){ S.reports = list; if (S.tab === "manage" && S.mtab !== "look" && !S.room) renderManage(); badges(); },
  rooms(list){
    S.rooms = Object.fromEntries(list.map(r => [r.id, r]));
    if (S.room && !S.rooms[S.room]){ toast("This chat is no longer available."); closeRoom(); }
    refreshChats();
  }
};
function refreshChats(){ if (S.room) renderRoomHeader(); else if (S.tab === "chats") renderChats(); badges(); }
function rerenderTab(){ ({ ann: renderAnn, chats: renderChats, manage: renderManage, me: renderMe })[S.tab]?.(); }

async function joinWithInvite(){

/* Room */
let roomUnsub = null, stickBottom = true;
function openRoom(id, fromHistory = false){
  if (!S.rooms[id]) return;
  if (S.room) roomUnsub?.();
  S.room = id; S.msgs = [];
  ["Ann","Chats","Manage","Me"].forEach(k => $("#v"+k).classList.add("hidden"));
  $("#vRoom").classList.remove("hidden");
  $("#mainArea").style.overflowY = "hidden";
  $("#msgList").innerHTML = "";
  renderHeader();
  stickBottom = true;
  roomUnsub = api.watchRoom(id, list => { const stick = nearBottom(); S.msgs = list; renderMsgs(stick || stickBottom); stickBottom = false; markSeen(); });
  if (!fromHistory) history.pushState({ room: id }, "");
  markSeen();
}
function closeRoom(silent = false){
  if (!S.room) return;
  roomUnsub?.(); roomUnsub = null;
  S.room = null; S.msgs = [];
  if (!silent){ $("#vRoom").classList.add("hidden"); setTab("chats"); }
}
function markSeen(){ if (S.room) store.set(seenKey(S.room), Date.now()); }
function renderRoomHeader(){
  const r = S.rooms[S.room]; if (!r) return;
  const count = r.type === "main" ? Object.values(S.members).filter(m => m.role === "member" || m.role === "leader").length : r.members.length;
  $("#viewTitle").innerHTML = esc(roomTitle(r)) + `<small>${r.type === "dm" ? "Private message" : count + " people"}</small>`;
  $("#roomNote").textContent = r.type === "main" ? "🔒 End-to-end encrypted · Be kind and respectful." : "🔒 End-to-end encrypted. Only the people in this chat can read it.";
}
function nearBottom(){ const l = $("#msgList"); return !l || l.scrollHeight - l.scrollTop - l.clientHeight < 140; }
const mediaUrls = new Map();
const mediaUrl = f => f?.url || (f?.path ? mediaUrls.get(f.path) : null);
function fileHTML(f, mid){
  const url = mediaUrl(f);
  if (f.type?.startsWith("image/")) return `<div class="bubble media" data-sel>${url ? `<img src="${esc(url)}" alt="${esc(f.name)}" data-view="${esc(url)}">` : `<div class="ph" data-media="${esc(mid)}">🔒 Decrypting photo…</div>`}</div>`;
  if (f.type?.startsWith("video/") && url) return `<div class="bubble media" data-sel><video src="${esc(url)}" controls playsinline preload="metadata"></video></div>`;
  const ext = (f.name.split(".").pop() || "file").slice(0, 4).toUpperCase();
  return `<div class="bubble" data-sel><button type="button" class="filecard" data-openfile="${esc(mid)}"><span class="fi">${esc(ext)}</span><div><div class="fn">${esc(f.name)}</div><div class="fs">${fmtSize(f.size || 0)} · Open</div></div></button></div>`;
}
function renderMsgs(stick){
  const l = $("#msgList"); if (!l) return;
  const r = S.rooms[S.room] || {};
  let html = "", lastDay = "", prev = null;
  for (const m of S.msgs){
    const day = new Date(m.at).toDateString();
    if (day !== lastDay){ html += `<div class="day">${fmtDay(m.at)}</div>`; lastDay = day; prev = null; }
    const mine = m.uid === S.user?.uid;
    const cont = prev && prev.uid === m.uid && m.at - prev.at < 5*60e3;
    const showWho = !mine && !cont && r.type !== "dm";
    const canDel = mine || (isLeader() && r.type === "main") || (r.type === "group" && r.createdBy === S.user.uid);
    const acts = (!mine && !m.locked ? `<button class="act" data-act="report" data-id="${esc(m.id)}">Report</button>` : "") + (canDel ? `<button class="act danger" data-act="delMsg" data-id="${esc(m.id)}">Delete</button>` : "");
    html += `<div class="msg ${mine ? "me" : ""} ${cont ? "cont" : ""}" data-msg="${esc(m.id)}">
      ${mine ? "" : avatarHTML(nameOf(m.uid), photoOf(m.uid))}
      <div class="col">${showWho ? `<div class="who">${esc(nameOf(m.uid))}${S.members[m.uid]?.role === "leader" ? ` <span class="lead">· Leader</span>` : ""}</div>` : ""}
        ${m.locked ? `<div class="bubble locked" data-sel>🔒 Waiting for access…</div>` : (m.file ? fileHTML(m.file, m.id) : "") + (m.text ? `<div class="bubble" data-sel>${esc(m.text)}</div>` : "")}
        ${acts ? `<div class="acts">${acts}</div>` : ""}</div>
      <span class="time">${fmtTime(m.at)}</span>
    </div>`;
    prev = m;
  }
  for (const [k, u] of Object.entries(S.uploads)) if (u.room === S.room)
    html += `<div class="uploading" id="up_${k}">Encrypting & sending ${esc(u.name)}…<div class="bar"><i style="width:${Math.round(u.p*100)}%"></i></div></div>`;
  l.innerHTML = html || `<div class="empty">${r.type === "dm" ? "Say hi 👋" : "No messages yet. Say hi 👋"}</div>`;
  if (stick) l.scrollTop = l.scrollHeight;
  loadMedia();
}
async function loadMedia(){
  for (const el of document.querySelectorAll("[data-media]")){
    const m = S.msgs.find(x => x.id === el.dataset.media); if (!m?.file?.path || mediaUrls.has(m.file.path)) continue;
    mediaUrls.set(m.file.path, null);
    try { mediaUrls.set(m.file.path, await api.fileUrl(S.room, m.file)); renderMsgs(nearBottom()); }
    catch(e){ console.warn(e); el.textContent = "Couldn't open photo"; }
  }
}
async function openFile(mid){
  const m = S.msgs.find(x => x.id === mid); if (!m?.file) return;
  if (DEMO && m.file.url === "#") return toast("Files open here in the real app");
  try {
    const url = mediaUrl(m.file) || await api.fileUrl(S.room, m.file);
    const a = document.createElement("a"); a.href = url; a.download = m.file.name; a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
  } catch(e){ console.warn(e); toast("Couldn't open the file. Try again."); }
}

/* Report */
function openReport(mid){

  let reason = "";
  const bg = sheet(`<h3>Report this message</h3>
    <div class="sheet-note">${IC.flag}<span>A copy of this one message goes, encrypted, to the leaders of ${esc(theme()?.name || "your group")} so they can help. ${esc(nameOf(m.uid))} won't be told who reported it.</span></div>
    <div class="reasons">${REASONS.map(x => `<button type="button" data-reason="${esc(x)}">${esc(x)}</button>`).join("")}</div>

    const b = e.target.closest("[data-reason]");

      await api.report({ reason, note: $("#repNote").value.trim(), room: roomTitle(r), msg: { uid: m.uid, name: nameOf(m.uid), text: m.text, at: m.at, fileName: m.file?.name || "", thumb } });
      bg.remove(); toast("Report sent to your leaders. Thank you for speaking up.");
    } catch(err){ console.warn(err); $("#repGo").disabled = false; $("#repGo").textContent = "Send report"; toast("Couldn't send the report. Try again."); }
  });

function bindLook(){
  const t = lookDraft, re = () => { const y = $("#mainArea").scrollTop; renderManage(); $("#mainArea").scrollTop = y; };
  const sync = () => { t.name = $("#lkName").value; t.tagline = $("#lkTag").value; t.welcome = $("#lkWelcome").value; };
  ["lkName","lkTag","lkWelcome"].forEach(id => $("#" + id).addEventListener("change", () => { sync(); re(); }));
  document.querySelectorAll("[data-color]").forEach(b => b.addEventListener("click", () => { sync(); t.accent = b.dataset.color; re(); }));
  $("#lkCustom").addEventListener("change", e => { sync(); t.accent = e.target.value; re(); });
  $("#lkLogoBtn").addEventListener("click", () => $("#lkLogo").click());
  $("#lkLogoDel")?.addEventListener("click", () => { sync(); t.logo = ""; re(); });
  $("#lkLogo").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    sync();
    const url = URL.createObjectURL(f);
    try { let dataUrl = await squareImage(url, 256, "image/png"); if (dataUrl.length > 90000) dataUrl = await squareImage(url, 256, "image/jpeg", .85); t.logo = dataUrl; re(); }
    catch { toast("Couldn't use that image. Try a PNG or JPG."); }
    URL.revokeObjectURL(url);
  });
  $("#lookForm").addEventListener("submit", async e => {
    e.preventDefault(); sync();
    const clean = { name: t.name.trim().slice(0, 40) || theme().name, tagline: t.tagline.trim().slice(0, 60), accent: /^#[0-9a-fA-F]{6}$/.test(t.accent) ? t.accent : ACCENTS[0], logo: t.logo || "", welcome: t.welcome.trim().slice(0, 300) };

    catch(err){ console.warn(err); toast("Couldn't save. Try again."); }
  });
}

  const r = S.rooms[S.room]; if (!r) return;
  const me = S.user.uid, canManage = r.type === "group" && r.createdBy === me;
  const people = r.type === "main" ? Object.entries(S.members).filter(([, m]) => m.role === "member" || m.role === "leader").map(([id]) => id) : r.members;
  const rows = people.map(id => `<div class="pick">${avatarHTML(nameOf(id), photoOf(id))}<span class="info">${esc(nameOf(id))}${id === me ? " <small>You</small>" : S.members[id]?.role === "leader" ? "<small>Leader</small>" : ""}</span>
      ${canManage && id !== me ? `<button class="pill no" data-kick="${esc(id)}">Remove</button>` : ""}</div>`).join("");
  const bg = sheet(`<h3>${r.type === "group" ? "Group info" : r.type === "dm" ? "Private message" : esc(mainName())}</h3>
    <div class="sheet-note">${IC.lock}<span>End-to-end encrypted. ${r.type === "main" ? "Everyone approved in this group can read it." : "Only the people in this chat can read it."}</span></div>
    ${canManage ? `<div class="field"><label for="grpRename">Group name</label><div class="row"><input id="grpRename" maxlength="40" value="${esc(r.name)}" style="margin:0"><button class="pill ghost" data-rename>Save</button></div></div>` : ""}
    <div class="sec-title" style="margin-top:4px">${people.length} people</div>
    <div class="scroll">${canManage ? `<button class="menu-row" data-addppl><span class="avatar group">${IC.plus}</span>Add people</button>` : ""}${rows}</div>
    ${r.type === "group" ? `<button class="btn danger" data-leave>Leave group</button>` : ""}
    ${canManage ? `<button class="btn danger" data-delgroup style="margin-top:8px">Delete group for everyone</button>` : ""}`);
  bg.addEventListener("click", async e => {
    try {
      if (e.target.closest("[data-addppl]")){ bg.remove(); openGroupForm(r.id); }
      else if (e.target.closest("[data-rename]")){ const n = $("#grpRename").value.trim(); if (n){ await api.updateGroup(r.id, { name: n }); toast("Group renamed"); } }
      else if (e.target.closest("[data-kick]")){ const id = e.target.closest("[data-kick]").dataset.kick; bg.remove();
        if (await askConfirm(`Remove ${nameOf(id)} from ${r.name}?`, "Remove", true)) await api.updateGroup(r.id, { members: r.members.filter(x => x !== id) }); }
      else if (e.target.closest("[data-leave]")){ bg.remove();
        if (await askConfirm(`Leave ${r.name}? You won't see its messages anymore.`, "Leave", true)){ closeRoom(); await api.leaveGroup(r.id); } }
      else if (e.target.closest("[data-delgroup]")){ bg.remove();
        if (await askConfirm(`Delete ${r.name} and all its messages for everyone? This can't be undone.`, "Delete", true)){ closeRoom(); await api.deleteGroup(r.id); toast("Group deleted"); } }
    } catch(err){ toast("That didn't work. Try again."); console.error(err); }
  });
}
function openLightbox(url){
  const lb = document.createElement("div"); lb.className = "lightbox";
  lb.innerHTML = `<img src="${esc(url)}" alt=""><div class="lb-bar"><button data-x>Close</button></div>`;
  lb.addEventListener("click", () => lb.remove());
  document.body.appendChild(lb);
}

/* Sending files */
async function sendFiles(files){
  const rid = S.room; if (!rid) return;
  for (const file of files){
    if (file.size > MAX_FILE_MB * 1048576){ toast(`${file.name} is over ${MAX_FILE_MB} MB. Try a smaller file.`); continue; }
    const key = Math.random().toString(36).slice(2);
    S.uploads[key] = { room: rid, name: file.name, p: 0 };
    if (S.room === rid) renderMsgs(true);
    try {
      const { blob, name, type } = await prepImage(file);
      const up = await api.upload(rid, blob, name, p => { S.uploads[key].p = p; const bar = document.querySelector(`#up_${key} .bar i`); if (bar) bar.style.width = Math.round(p * 100) + "%"; });
      delete S.uploads[key];
      if (up.path && type?.startsWith("image/")) mediaUrls.set(up.path, URL.createObjectURL(blob));
      await api.send(rid, "", { name, type: type || "application/octet-stream", size: blob.size, ...up });
    } catch(err){
      delete S.uploads[key]; if (S.room === rid) renderMsgs(false);
      toast(String(err?.message) === "no-key" ? "Waiting for access to this chat. Try again in a moment." : `${file.name} didn't send. Check your connection and try again.`); console.error(err);
    }
  }
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const view = e.target.closest("[data-view]"); if (view){ openLightbox(view.dataset.view); return; }
  const of = e.target.closest("[data-openfile]"); if (of){ openFile(of.dataset.openfile); return; }
  const sel = e.target.closest("[data-sel]");
  document.querySelectorAll(".msg.sel").forEach(m => { if (!sel || m !== sel.closest(".msg")) m.classList.remove("sel"); });
  if (sel){ const m = sel.closest(".msg"); if (m?.querySelector(".acts")) m.classList.toggle("sel"); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  try {
    if (act === "logout"){ leaveChurch(); await api.logout(); }
    if (act === "home"){ leaveChurch(); store.set("lastGroup", null); renderHome(); }
    if (act === "openGroup"){ if (S.invite) clearInvite(); enterChurch(id); }
    if (act === "join") joinWithInvite();
    if (act === "clearInvite"){ clearInvite(); renderHome(); }
    if (act === "startGroup") openStartGroup();
    if (act === "newAnn") openAnnSheet();
    if (act === "hideTip"){ store.set("hideTip", true); renderAnn(); }
    if (act === "installNow" && installEvt){ installEvt.prompt(); const { outcome } = await installEvt.userChoice; installEvt = null; if (outcome === "accepted") store.set("hideTip", true); renderAnn(); }
    if (act === "openRoom") openRoom(id);
    if (act === "mtab"){ S.mtab = b.dataset.k; lookDraft = null; renderManage(); }
    if (act === "copyLink") copyText(inviteLink(S.church.invite));
    if (act === "newInvite" && await askConfirm("Make a new invite link? The old link and code will stop working.", "Make new link")){ await api.newInvite(S.church.theme, S.church.invite); toast("New invite link ready"); }
    if (act === "report") openReport(id);
    if (act === "dismiss"){ await api.dismissReport(id); toast("Marked as handled"); }
    if (act === "delAnn" && await askConfirm("Delete this announcement?", "Delete", true)) await api.delAnn(id);
    if (act === "delMsg"){
      const m = S.msgs.find(x => x.id === id);
      if (m && await askConfirm(m.file ? "Delete this file for everyone?" : "Delete this message for everyone?", "Delete", true)) await api.delMsg(S.room, m);
    }
    if (act === "role"){
      const u = S.members[id], r = b.dataset.role, nm = u?.name || "this person";
      const msg = { member: u?.role === "leader" ? `Make ${nm} a regular member?` : `Approve ${nm}?`, leader: `Make ${nm} a leader? Leaders can post announcements, approve people, read reports and customize the app. They still can't read private chats.`, removed: u?.role === "pending" ? `Decline ${nm}?` : `Remove ${nm} from ${theme()?.name}? They'll lose access to every chat in this group.` }[r];
      const ok = { member: u?.role === "leader" ? "Make member" : "Approve", leader:"Make leader", removed: u?.role === "pending" ? "Decline" : "Remove" }[r];
      if (await askConfirm(msg, ok, r === "removed")){ await api.setRole(id, r); if (r === "removed") toast(`${nm} was removed`); }
    }
  } catch(err){ toast("That didn't work. You may not have permission."); console.error(err); }
});
document.addEventListener("contextmenu", e => { const m = e.target.closest(".msg"); if (!m || !m.querySelector(".acts")) return; e.preventDefault(); m.classList.add("sel"); });
$("#btnLogin").addEventListener("click", () => api.login());
$("#btnMe").addEventListener("click", () => setTab("me"));
$("#btnNew").addEventListener("click", openNewChat);
$("#btnInfo").addEventListener("click", openRoomInfo);
$("#btnBack").addEventListener("click", () => { if (history.state?.room) history.back(); else closeRoom(); });
window.addEventListener("popstate", e => { if (e.state?.room && S.rooms[e.state.room]) openRoom(e.state.room, true); else if (S.room) closeRoom(); });
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });
const input = $("#chatInput"), sendBtn = $("#btnSend");
$("#btnAttach").addEventListener("click", () => $("#fileInput").click());
$("#fileInput").addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) sendFiles(f); });
input.addEventListener("input", () => { sendBtn.disabled = !input.value.trim(); input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer:fine)").matches){ e.preventDefault(); $("#chatForm").requestSubmit(); } });
input.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])]; if (f.length){ e.preventDefault(); sendFiles(f); } });
$("#chatForm").addEventListener("submit", async e => {
  e.preventDefault();
  const t = input.value.trim(); if (!t || !S.room) return;
  input.value = ""; input.style.height = "auto"; sendBtn.disabled = true;
  try { await api.send(S.room, t); const l = $("#msgList"); l.scrollTop = l.scrollHeight; }
  catch(err){ input.value = t; sendBtn.disabled = false; toast(String(err?.message) === "no-key" ? "Waiting for access to this chat. Try again in a moment." : "Message not sent. Try again."); console.error(err); }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "nameForm") return;
  e.preventDefault();
  const n = $("#nameInput").value.trim(); if (!n) return;
  try { await api.setName(n); toast("Name updated"); } catch { toast("Couldn't save. Try again."); }
});

/* ---------- start ---------- */
const urlInvite = new URLSearchParams(location.search).get("invite");
if (urlInvite) store.set("invite", urlInvite.toUpperCase().replace(/[^A-Z0-9]/g, ""));
S.invite = store.get("invite", null);
function startupError(e){
  console.error(e);
  show("scrPending");
  $("#pendingBox").innerHTML = `<div class="lockhero">${IC.lock}</div><h2>The app couldn't start</h2>
    <p>Check your internet connection and try again. If it keeps happening, tell your leader.</p>
    <p style="margin-top:10px;color:var(--ink-3);font-size:13px">${esc(e?.message || e)}</p>
    <button class="btn accent" style="max-width:240px;margin-top:22px" onclick="location.reload()">Try again</button>`;
}
window.addEventListener("error", e => { if ($("#scrLoading") && !$("#scrLoading").classList.contains("hidden")) startupError(e.error || e.message); });
window.addEventListener("unhandledrejection", e => { if (!$("#scrLoading").classList.contains("hidden")) startupError(e.reason); });
try { api = DEMO ? demoApi() : await firebaseApi(); } catch(e){ startupError(e); throw e; }
if (S.invite) api.previewInvite(S.invite).then(i => { S.inviteInfo = i; if (!S.user) renderLogin(); }).catch(() => {});
api.onAuth(onAuth);
if (!DEMO && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
